name: RLF test suite

on:
  push:
  pull_request:

jobs:
  tests:
    name: Proves del sistema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar totes les suites
        run: python3 tests/run_all.py

      - name: Comprovar sintaxi de tots els moduls
        run: python3 -m compileall -q shared projects governance tests
